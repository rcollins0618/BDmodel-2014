name: Compile Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libncurses5-dev
      - name: Run test script
        run: bash ./test_compile.sh
